<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Credit Ledger</title>
  <desc id="d">A gauge sweeps to a 95.3% default probability and a red HIGH RISK stamp lands, then a second applicant scores 2.5% and receives a green LOW RISK stamp.</desc>
  <style>
.serif{font-family:Georgia, "Times New Roman", serif} .sans{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.seal{fill:none;stroke:#c7a468;stroke-width:1.2}
.track{fill:none;stroke:#2a3743;stroke-width:10}
.fill{fill:none;stroke:#c1584d;stroke-width:10;stroke-linecap:round;
      stroke-dasharray:540.35 1081;stroke-dashoffset:25.40}
.stampA,.stampB{transform-box:fill-box;transform-origin:center;transform:rotate(-7deg)}
.stampA{opacity:1} .stampB{opacity:0} .numB{opacity:0}
@keyframes sweep {
  0% { stroke-dashoffset:540.35; stroke:#c1584d }
  5% { stroke-dashoffset:540.35; stroke:#c1584d; animation-timing-function:cubic-bezier(.22,1,.36,1) }
  17% { stroke-dashoffset:25.40; stroke:#c1584d }
  42% { stroke-dashoffset:25.40; stroke:#c1584d; animation-timing-function:cubic-bezier(.5,0,.9,.4) }
  47% { stroke-dashoffset:540.35; stroke:#c1584d }
  47.5% { stroke-dashoffset:540.35; stroke:#c7a468 }
  53% { stroke-dashoffset:540.35; stroke:#c7a468; animation-timing-function:cubic-bezier(.22,1,.36,1) }
  58% { stroke-dashoffset:526.85; stroke:#c7a468 }
  87% { stroke-dashoffset:526.85; stroke:#c7a468; animation-timing-function:cubic-bezier(.5,0,.9,.4) }
  93% { stroke-dashoffset:540.35; stroke:#c7a468 }
  93.5% { stroke-dashoffset:540.35; stroke:#c1584d }
  100% { stroke-dashoffset:540.35; stroke:#c1584d }
}
@keyframes slamA {
  0% { opacity:0; transform:scale(1.6) rotate(8deg) }
  17% { opacity:0; transform:scale(1.6) rotate(8deg); animation-timing-function:ease-out }
  19.5% { opacity:1; transform:scale(.94) rotate(-6deg); animation-timing-function:ease-in-out }
  20.4% { opacity:1; transform:scale(1.04) rotate(-8deg); animation-timing-function:ease-in-out }
  21.2% { opacity:1; transform:scale(1) rotate(-7deg) }
  40% { opacity:1; transform:scale(1) rotate(-7deg); animation-timing-function:ease-in }
  42% { opacity:0; transform:scale(1) rotate(-7deg) }
  100% { opacity:0; transform:scale(1) rotate(-7deg) }
}
@keyframes slamB {
  0% { opacity:0; transform:scale(1.6) rotate(8deg) }
  58% { opacity:0; transform:scale(1.6) rotate(8deg); animation-timing-function:ease-out }
  60.5% { opacity:1; transform:scale(.94) rotate(-6deg); animation-timing-function:ease-in-out }
  61.4% { opacity:1; transform:scale(1.04) rotate(-8deg); animation-timing-function:ease-in-out }
  62.2% { opacity:1; transform:scale(1) rotate(-7deg) }
  85% { opacity:1; transform:scale(1) rotate(-7deg); animation-timing-function:ease-in }
  87% { opacity:0; transform:scale(1) rotate(-7deg) }
  100% { opacity:0; transform:scale(1) rotate(-7deg) }
}
@keyframes numA {
  0% { opacity:0 }
  17% { opacity:0 }
  19% { opacity:1 }
  40% { opacity:1 }
  42% { opacity:0 }
  100% { opacity:0 }
}
@keyframes numB {
  0% { opacity:0 }
  58% { opacity:0 }
  60% { opacity:1 }
  85% { opacity:1 }
  87% { opacity:0 }
  100% { opacity:0 }
}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: no-preference){
  .seal{stroke-dasharray:var(--len);animation:draw 1.4s ease-out both}
  .fill{animation:sweep 12s linear infinite}
  .stampA{animation:slamA 12s linear infinite}
  .stampB{animation:slamB 12s linear infinite}
  .numA{animation:numA 12s linear infinite}
  .numB{animation:numB 12s linear infinite}
}
</style>
  <rect x=".5" y=".5" width="959" height="319" rx="14" fill="#0e141b" stroke="#2a3743"/>

  <g transform="translate(56 50) scale(1.5)">
    <circle class="seal" style="--len:113.1" cx="20" cy="20" r="18"/>
    <circle class="seal" style="--len:81.7" cx="20" cy="20" r="13"/>
    <path class="seal" style="--len:20" d="M20 10 L20 30 M10 20 L30 20"/>
  </g>
  <text class="serif" x="56" y="170" font-size="46" font-weight="700" fill="#e8ecee">Credit Ledger</text>
  <text class="sans" x="56" y="206" font-size="16" fill="#8b98a5">Scores a loan application for default risk</text>
  <text class="sans" x="56" y="230" font-size="16" fill="#8b98a5">with a calibrated XGBoost model, served by</text>
  <text class="sans" x="56" y="254" font-size="16" fill="#8b98a5">FastAPI and presented as a gauge and a stamp.</text>

  <g transform="translate(640 160)">
    <circle class="track" r="86"/>
    <circle class="fill" r="86" transform="rotate(-90)"/>
    <text class="mono numA" text-anchor="middle" y="8"><tspan font-size="34" font-weight="600" fill="#e8ecee">95.3</tspan><tspan font-size="18" fill="#8b98a5" dx="2">%</tspan></text>
    <text class="mono numB" text-anchor="middle" y="8"><tspan font-size="34" font-weight="600" fill="#e8ecee">2.5</tspan><tspan font-size="18" fill="#8b98a5" dx="2">%</tspan></text>
    <text class="sans" text-anchor="middle" y="32" font-size="10.5" fill="#5c6773">default probability</text>
  </g>

  <g transform="translate(842 160)">
    <g class="stampA">
      <circle r="48" fill="none" stroke="#c1584d" stroke-width="4" stroke-opacity=".15"/>
      <circle r="50" fill="none" stroke="#c1584d" stroke-width="2.5"/>
      <circle r="44" fill="none" stroke="#c1584d" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".45"/>
      <text class="serif" text-anchor="middle" y="5" font-size="15" font-weight="700" letter-spacing=".5" fill="#c1584d">HIGH RISK</text>
    </g>
    <g class="stampB">
      <circle r="48" fill="none" stroke="#5f9270" stroke-width="4" stroke-opacity=".15"/>
      <circle r="50" fill="none" stroke="#5f9270" stroke-width="2.5"/>
      <circle r="44" fill="none" stroke="#5f9270" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".45"/>
      <text class="serif" text-anchor="middle" y="5" font-size="15" font-weight="700" letter-spacing=".5" fill="#5f9270">LOW RISK</text>
    </g>
  </g>
</svg>
