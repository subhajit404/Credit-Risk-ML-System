<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 206" width="960" height="206" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Credit Ledger pipeline</title>
  <desc id="d">Six stages, left to right: dataset, clean, preprocess, tune, calibrate and serve. The first five happen in the notebook and the last in the FastAPI app.</desc>
  <style>
.serif{font-family:Georgia, "Times New Roman", serif} .sans{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.card{fill:#141d26;stroke:#2a3743;stroke-width:1}
.flow{stroke:#5c6773;stroke-width:1.5;stroke-linecap:round}
.brk{fill:none;stroke:#5c6773;stroke-width:1}
@keyframes lit0 {
  0%, 0% { stroke:#2a3743; fill:#141d26 }
  1.5% { stroke:#c7a468; fill:#1a2530 }
  14% { stroke:#c7a468; fill:#1a2530 }
  17% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes lit1 {
  0%, 13.5% { stroke:#2a3743; fill:#141d26 }
  15% { stroke:#c7a468; fill:#1a2530 }
  27.5% { stroke:#c7a468; fill:#1a2530 }
  30.5% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes lit2 {
  0%, 27% { stroke:#2a3743; fill:#141d26 }
  28.5% { stroke:#c7a468; fill:#1a2530 }
  41% { stroke:#c7a468; fill:#1a2530 }
  44% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes lit3 {
  0%, 40.5% { stroke:#2a3743; fill:#141d26 }
  42% { stroke:#c7a468; fill:#1a2530 }
  54.5% { stroke:#c7a468; fill:#1a2530 }
  57.5% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes lit4 {
  0%, 54% { stroke:#2a3743; fill:#141d26 }
  55.5% { stroke:#c7a468; fill:#1a2530 }
  68% { stroke:#c7a468; fill:#1a2530 }
  71% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes lit5 {
  0%, 67.5% { stroke:#2a3743; fill:#141d26 }
  69% { stroke:#c7a468; fill:#1a2530 }
  81.5% { stroke:#c7a468; fill:#1a2530 }
  84.5% { stroke:#2a3743; fill:#141d26 }
  100% { stroke:#2a3743; fill:#141d26 }
}
@keyframes flowing{to{stroke-dashoffset:-6}}
@media (prefers-reduced-motion: no-preference){
  .flow{stroke-dasharray:3 3;animation:flowing .9s linear infinite}
  .c0{animation:lit0 9s linear infinite}
  .c1{animation:lit1 9s linear infinite}
  .c2{animation:lit2 9s linear infinite}
  .c3{animation:lit3 9s linear infinite}
  .c4{animation:lit4 9s linear infinite}
  .c5{animation:lit5 9s linear infinite}
}
</style>
  <rect x=".5" y=".5" width="959" height="205" rx="14" fill="#0e141b" stroke="#2a3743"/>
    <g>
    <rect class="card c0" x="26" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="40" y="62" font-size="17" font-weight="700" fill="#e8ecee">Dataset</text>
    <text class="sans" x="40" y="88" font-size="12" fill="#8b98a5">32,581 loans</text>
    <text class="sans" x="40" y="106" font-size="12" fill="#8b98a5">21.8% defaulted</text>
  </g>
  <g>
    <rect class="card c1" x="182" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="196" y="62" font-size="17" font-weight="700" fill="#e8ecee">Clean</text>
    <text class="sans" x="196" y="88" font-size="12" fill="#8b98a5">31,522 rows kept</text>
    <text class="sans" x="196" y="106" font-size="12" fill="#8b98a5">outliers removed</text>
  </g>
  <g>
    <rect class="card c2" x="338" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="352" y="62" font-size="17" font-weight="700" fill="#e8ecee">Preprocess</text>
    <text class="sans" x="352" y="88" font-size="12" fill="#8b98a5">median impute,</text>
    <text class="sans" x="352" y="106" font-size="12" fill="#8b98a5">one-hot encode</text>
  </g>
  <g>
    <rect class="card c3" x="494" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="508" y="62" font-size="17" font-weight="700" fill="#e8ecee">Tune</text>
    <text class="sans" x="508" y="88" font-size="12" fill="#8b98a5">XGBoost search:</text>
    <text class="sans" x="508" y="106" font-size="12" fill="#8b98a5">150 × 5-fold CV</text>
  </g>
  <g>
    <rect class="card c4" x="650" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="664" y="62" font-size="17" font-weight="700" fill="#e8ecee">Calibrate</text>
    <text class="sans" x="664" y="88" font-size="12" fill="#8b98a5">sigmoid, 5 folds</text>
    <text class="sans" x="664" y="106" font-size="12" fill="#8b98a5">so 30% means 30%</text>
  </g>
  <g>
    <rect class="card c5" x="806" y="30" width="128" height="96" rx="6"/>
    <text class="serif" x="820" y="62" font-size="17" font-weight="700" fill="#e8ecee">Serve</text>
    <text class="sans" x="820" y="88" font-size="12" fill="#8b98a5">FastAPI /predict</text>
    <text class="sans" x="820" y="106" font-size="12" fill="#8b98a5">plus the web UI</text>
  </g>
    <line class="flow" x1="157" y1="78.0" x2="175" y2="78.0"/><polygon points="179,78.0 173,74.5 173,81.5" fill="#5c6773"/>
  <line class="flow" x1="313" y1="78.0" x2="331" y2="78.0"/><polygon points="335,78.0 329,74.5 329,81.5" fill="#5c6773"/>
  <line class="flow" x1="469" y1="78.0" x2="487" y2="78.0"/><polygon points="491,78.0 485,74.5 485,81.5" fill="#5c6773"/>
  <line class="flow" x1="625" y1="78.0" x2="643" y2="78.0"/><polygon points="647,78.0 641,74.5 641,81.5" fill="#5c6773"/>
  <line class="flow" x1="781" y1="78.0" x2="799" y2="78.0"/><polygon points="803,78.0 797,74.5 797,81.5" fill="#5c6773"/>
  <path class="brk" d="M26 144 V150 H778 V144"/>
  <path class="brk" d="M806 144 V150 H934 V144"/>
  <text class="mono" x="402.0" y="172" text-anchor="middle" font-size="11.5" fill="#8b98a5">Credit_Risk.ipynb writes credit_risk_model.pkl and best_threshold.pkl</text>
  <text class="mono" x="870.0" y="172" text-anchor="middle" font-size="11.5" fill="#8b98a5">main.py loads them</text>
</svg>
